<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parlayan Çiçekler</title>
<style>
  *, *::after, *::before {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
  }

  :root {
    --dark-color: #05050a;
  }

  body {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    min-height: 100vh;
    background-color: var(--dark-color);
    overflow: hidden;
    perspective: 1000px;
  }

  /* Arka Plan ve Yıldız Parıltıları */
  .night {
    position: fixed;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    width: 100%;
    height: 100%;
    background-image: 
      radial-gradient(ellipse at top, transparent 0%, var(--dark-color)), 
      radial-gradient(ellipse at bottom, var(--dark-color), rgba(145, 233, 255, 0.15));
  }

  .stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 8px #a7ffee;
    animation: twinkle 3s infinite ease-in-out;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 0.9; transform: scale(1.2); }
  }

  /* Çiçek Ana Kapsayıcı */
  .flowers {
    position: relative;
    transform: scale(0.9);
    z-index: 2;
  }

  .flower {
    position: absolute;
    bottom: 10vmin;
    transform-origin: bottom center;
    z-index: 10;
    --fl-speed: 0.8s;
  }

  .flower--1 {
    animation: moving-flower-1 4s linear infinite;
  }
  .flower--1 .flower__line {
    height: 70vmin;
    animation-delay: 0.3s;
  }

  .flower--2 {
    left: 50%;
    transform: rotate(20deg);
    animation: moving-flower-2 4s linear infinite;
  }
  .flower--2 .flower__line {
    height: 60vmin;
    animation-delay: 0.6s;
  }

  .flower--3 {
    left: 50%;
    transform: rotate(-15deg);
    animation: moving-flower-3 4s linear infinite;
  }
  .flower--3 .flower__line {
    height: 55vmin;
    animation-delay: 0.9s;
  }

  /* Çiçek Taç Yaprakları */
  .flower__leafs {
    position: relative;
    animation: blooming-flower 2s backwards;
  }
  .flower__leafs--1 { animation-delay: 1.1s; }
  .flower__leafs--2 { animation-delay: 1.4s; }
  .flower__leafs--3 { animation-delay: 1.7s; }

  .flower__leafs::after {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    transform: translate(-50%, -100%);
    width: 8vmin;
    height: 8vmin;
    background-color: #6bf0ff;
    filter: blur(10vmin);
  }

  .flower__leaf {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 8vmin;
    height: 11vmin;
    border-radius: 51% 49% 47% 53% / 44% 45% 55% 69%;
    background-color: #a7ffee;
    background-image: linear-gradient(to top, #54b8aa, #a7ffee);
    transform-origin: bottom center;
    opacity: 0.9;
    box-shadow: inset 0 0 2vmin rgba(255, 255, 255, 0.5);
  }

  .flower__leaf--1 { transform: translate(-10%, 1%) rotateY(40deg) rotateX(-50deg); }
  .flower__leaf--2 { transform: translate(-50%, -4%) rotateX(40deg); }
  .flower__leaf--3 { transform: translate(-90%, 0%) rotateY(45deg) rotateX(50deg); }
  .flower__leaf--4 {
    width: 8vmin;
    height: 8vmin;
    transform-origin: bottom left;
    border-radius: 4vmin 10vmin 4vmin 4vmin;
    transform: translate(0%, 18%) rotateX(70deg) rotate(-43deg);
    background-image: linear-gradient(to top, #39c6d6, #a7ffee);
    z-index: 1;
    opacity: 0.8;
  }

  .flower__white-circle {
    position: absolute;
    left: -3.5vmin;
    top: -3vmin;
    width: 9vmin;
    height: 4vmin;
    border-radius: 50%;
    background-color: #fff;
    box-shadow: 0 0 3vmin #a7ffee;
  }

  .flower__white-circle::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
    width: 60%;
    height: 60%;
    border-radius: inherit;
    background-image: linear-gradient(90deg, rgb(255, 235, 18), rgb(255, 206, 0));
  }

  /* Gövde ve Gövde Yaprakları */
  .flower__line {
    height: 55vmin;
    width: 1.5vmin;
    background-image: 
      linear-gradient(to left, rgba(0, 0, 0, 0.2), transparent, rgba(255, 255, 255, 0.2)), 
      linear-gradient(to top, transparent 10%, #14757a, #39c6d6);
    box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
    animation: grow-flower-tree 4s backwards;
  }

  .flower__line__leaf {
    --w: 7vmin;
    --h: calc(var(--w) + 2vmin);
    position: absolute;
    top: 20%;
    left: 90%;
    width: var(--w);
    height: var(--h);
    border-top-right-radius: var(--h);
    border-bottom-left-radius: var(--h);
    background-image: linear-gradient(to top, rgba(20, 117, 122, 0.4), #39c6d6);
    box-shadow: 0 0 1vmin rgba(57, 198, 214, 0.3);
  }

  .flower__line__leaf--1 { transform: rotate(70deg) rotateY(30deg); animation: blooming-leaf-right var(--fl-speed) 1.6s backwards; }
  .flower__line__leaf--2 { top: 45%; transform: rotate(70deg) rotateY(30deg); animation: blooming-leaf-right var(--fl-speed) 1.4s backwards; }
  .flower__line__leaf--3, .flower__line__leaf--4 {
    border-top-right-radius: 0;
    border-bottom-left-radius: 0;
    border-top-left-radius: var(--h);
    border-bottom-right-radius: var(--h);
    left: -460%;
    top: 12%;
    transform: rotate(-70deg) rotateY(30deg);
  }
  .flower__line__leaf--3 { animation: blooming-leaf-left var(--fl-speed) 1.2s backwards; }
  .flower__line__leaf--4 { top: 40%; animation: blooming-leaf-left var(--fl-speed) 1s backwards; }

  /* Çiçekten Çıkan Işık Parçacıkları */
  .flower__light {
    position: absolute;
    bottom: 0vmin;
    width: 1vmin;
    height: 1vmin;
    background-color: rgb(255, 251, 0);
    border-radius: 50%;
    filter: blur(0.2vmin);
    animation: light-ans 4s linear infinite backwards;
  }
  .flower__light:nth-child(odd) { background-color: #23f0ff; }
  .flower__light--1 { left: -2vmin; animation-delay: 1s; }
  .flower__light--2 { left: 3vmin; animation-delay: 0.5s; }
  .flower__light--3 { left: -6vmin; animation-delay: 0.3s; }
  .flower__light--4 { left: 6vmin; animation-delay: 0.9s; }
  .flower__light--5 { left: -1vmin; animation-delay: 1.5s; }
  .flower__light--6 { left: -4vmin; animation-delay: 3s; }
  .flower__light--7 { left: 3vmin; animation-delay: 2s; }
  .flower__light--8 { left: -6vmin; animation-delay: 3.5s; }

  /* Alt Çimenler */
  .grass {
    position: absolute;
    bottom: 10vmin;
    left: -25vmin;
    width: 50vmin;
    height: 30vmin;
    pointer-events: none;
  }

  .blade {
    position: absolute;
    bottom: 0;
    width: 1.2vmin;
    background-image: linear-gradient(to top, transparent 5%, #0c5838, #1dd180);
    border-radius: 100% 0 0 0;
    transform-origin: bottom center;
    animation: grow-grass 2.5s ease-out backwards;
  }

  /* Animasyon Tanımları */
  @keyframes light-ans {
    0% { opacity: 0; transform: translateY(0vmin); }
    25% { opacity: 1; transform: translateY(-5vmin) translateX(-2vmin); }
    50% { opacity: 1; transform: translateY(-15vmin) translateX(2vmin); filter: blur(0.2vmin); }
    75% { transform: translateY(-20vmin) translateX(-2vmin); filter: blur(0.2vmin); }
    100% { transform: translateY(-30vmin); opacity: 0; filter: blur(1vmin); }
  }

  @keyframes moving-flower-1 {
    0%, 100% { transform: rotate(2deg); }
    50% { transform: rotate(-2deg); }
  }
  @keyframes moving-flower-2 {
    0%, 100% { transform: rotate(18deg); }
    50% { transform: rotate(14deg); }
  }
  @keyframes moving-flower-3 {
    0%, 100% { transform: rotate(-18deg); }
    50% { transform: rotate(-20deg) rotateY(-10deg); }
  }

  @keyframes blooming-leaf-right {
    0% { transform-origin: left; transform: rotate(70deg) rotateY(30deg) scale(0); }
  }
  @keyframes blooming-leaf-left {
    0% { transform-origin: right; transform: rotate(-70deg) rotateY(30deg) scale(0); }
  }
  @keyframes grow-flower-tree {
    0% { height: 0; border-radius: 1vmin; }
  }
  @keyframes blooming-flower {
    0% { transform: scale(0); }
  }
  @keyframes grow-grass {
    0% { transform: scaleY(0); opacity: 0; }
  }

  .not-loaded * {
    animation-play-state: paused !important;
  }
</style>
</head>
<body class="not-loaded">

  <div class="night"></div>
  <div class="stars" id="stars"></div>

  <div class="flowers">
    <!-- 1. Çiçek (Orta) -->
    <div class="flower flower--1">
      <div class="flower__leafs flower__leafs--1">
        <div class="flower__leaf flower__leaf--1"></div>
        <div class="flower__leaf flower__leaf--2"></div>
        <div class="flower__leaf flower__leaf--3"></div>
        <div class="flower__leaf flower__leaf--4"></div>
        <div class="flower__white-circle"></div>
        <div class="flower__light flower__light--1"></div>
        <div class="flower__light flower__light--2"></div>
        <div class="flower__light flower__light--3"></div>
        <div class="flower__light flower__light--4"></div>
        <div class="flower__light flower__light--5"></div>
        <div class="flower__light flower__light--6"></div>
        <div class="flower__light flower__light--7"></div>
        <div class="flower__light flower__light--8"></div>
      </div>
      <div class="flower__line">
        <div class="flower__line__leaf flower__line__leaf--1"></div>
        <div class="flower__line__leaf flower__line__leaf--2"></div>
        <div class="flower__line__leaf flower__line__leaf--3"></div>
        <div class="flower__line__leaf flower__line__leaf--4"></div>
      </div>
    </div>

    <!-- 2. Çiçek (Sağ) -->
    <div class="flower flower--2">
      <div class="flower__leafs flower__leafs--2">
        <div class="flower__leaf flower__leaf--1"></div>
        <div class="flower__leaf flower__leaf--2"></div>
        <div class="flower__leaf flower__leaf--3"></div>
        <div class="flower__leaf flower__leaf--4"></div>
        <div class="flower__white-circle"></div>
        <div class="flower__light flower__light--1"></div>
        <div class="flower__light flower__light--2"></div>
        <div class="flower__light flower__light--3"></div>
        <div class="flower__light flower__light--4"></div>
      </div>
      <div class="flower__line">
        <div class="flower__line__leaf flower__line__leaf--1"></div>
        <div class="flower__line__leaf flower__line__leaf--2"></div>
        <div class="flower__line__leaf flower__line__leaf--3"></div>
        <div class="flower__line__leaf flower__line__leaf--4"></div>
      </div>
    </div>

    <!-- 3. Çiçek (Sol) -->
    <div class="flower flower--3">
      <div class="flower__leafs flower__leafs--3">
        <div class="flower__leaf flower__leaf--1"></div>
        <div class="flower__leaf flower__leaf--2"></div>
        <div class="flower__leaf flower__leaf--3"></div>
        <div class="flower__leaf flower__leaf--4"></div>
        <div class="flower__white-circle"></div>
        <div class="flower__light flower__light--1"></div>
        <div class="flower__light flower__light--2"></div>
        <div class="flower__light flower__light--3"></div>
        <div class="flower__light flower__light--4"></div>
      </div>
      <div class="flower__line">
        <div class="flower__line__leaf flower__line__leaf--1"></div>
        <div class="flower__line__leaf flower__line__leaf--2"></div>
        <div class="flower__line__leaf flower__line__leaf--3"></div>
        <div class="flower__line__leaf flower__line__leaf--4"></div>
      </div>
    </div>

    <!-- Çimenler -->
    <div class="grass" id="grass"></div>
  </div>

  <script>
    window.onload = () => {
      // Animasyonu başlat
      setTimeout(() => {
        document.body.classList.remove("not-loaded");
      }, 300);

      // Arka plan yıldızlarını oluştur
      const starsContainer = document.getElementById('stars');
      for (let i = 0; i < 60; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 2.5 + 1;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 80}%`;
        star.style.animationDelay = `${Math.random() * 3}s`;
        starsContainer.appendChild(star);
      }

      // Çimen yapraklarını oluştur
      const grassContainer = document.getElementById('grass');
      const grassData = [
        { left: 10, height: 22, rot: -35, delay: 0.8 },
        { left: 14, height: 28, rot: -25, delay: 1.0 },
        { left: 18, height: 18, rot: -15, delay: 1.2 },
        { left: 22, height: 25, rot: -10, delay: 0.9 },
        { left: 27, height: 24, rot: 12, delay: 1.1 },
        { left: 31, height: 19, rot: 20, delay: 1.3 },
        { left: 35, height: 27, rot: 28, delay: 0.9 },
        { left: 39, height: 21, rot: 38, delay: 1.4 }
      ];

      grassData.forEach(data => {
        const blade = document.createElement('div');
        blade.className = 'blade';
        blade.style.left = `${data.left}vmin`;
        blade.style.height = `${data.height}vmin`;
        blade.style.transform = `rotate(${data.rot}deg)`;
        blade.style.animationDelay = `${data.delay}s`;
        grassContainer.appendChild(blade);
      });
    };
  </script>
</body>
</html>
